name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  server:
    name: Server tests (Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkedin
          POSTGRES_PASSWORD: linkedin
          POSTGRES_DB: linkedin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkedin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      KAFKA_ENABLED: 'false'
      JWT_SECRET: ci_test_secret
      DATABASE_URL: postgres://linkedin:linkedin@localhost:5432/linkedin
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Test
        working-directory: server
        run: npm test

  client:
    name: Client build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build
