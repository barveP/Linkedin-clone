<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a66c2" />

    <!-- Primary SEO meta tags -->
    <title>InLink — Connect with your professional world</title>
    <meta
      name="description"
      content="InLink is a professional networking app: build your profile, grow your network, share posts, and follow a real-time activity feed."
    />
    <meta name="keywords" content="professional network, jobs, career, networking, posts, connections" />
    <meta name="author" content="InLink" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InLink" />
    <meta property="og:title" content="InLink — Connect with your professional world" />
    <meta
      property="og:description"
      content="Build your profile, grow your network, and follow a real-time activity feed."
    />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InLink — Connect with your professional world" />
    <meta name="twitter:description" content="A professional network with a real-time activity feed." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured data for richer search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "InLink",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web",
        "description": "A professional networking app with a real-time activity feed."
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
